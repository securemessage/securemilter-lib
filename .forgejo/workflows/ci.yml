name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: FreeBSD
    steps:
      - name: Checkout securemilter-lib
        uses: actions/checkout@v4
        with:
          path: securemilter-lib

      - name: libzmq (event bus link dependency)
        run: pkg info -q libzmq4 || doas pkg install -y libzmq4

      - name: Build
        run: cd securemilter-lib && zig build

      - name: Unit tests
        run: cd securemilter-lib && zig build test
